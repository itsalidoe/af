<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expert Insights</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="search-panel">
            <h1>Expert Insights</h1>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search by title, company, topic...">
                <button onclick="searchInterviews()">Search</button>
            </div>
            <div class="sort-controls">
                <label for="sortBy">Sort by:</label>
                <select id="sortBy" onchange="updateSort()">
                    <option value="released_at">Release Date</option>
                    <option value="title">Title</option>
                </select>
                <button id="sortOrder" onclick="toggleSortOrder()">&#8595;</button>
            </div>
            <p id="indexStatus" class="index-status"></p>
            <div id="searchResults"></div>
            <div class="pagination">
                <button id="prevPage" onclick="changePage(-1)">Previous</button>
                <span id="pageInfo"></span>
                <button id="nextPage" onclick="changePage(1)">Next</button>
            </div>
        </div>
        <div class="content-viewer">
            <div id="pdfPlaceholder">
                <p>Select a document to view the PDF</p>
            </div>
            <iframe id="pdfContainer" style="display: none;" width="100%" height="100%" frameborder="0"></iframe>
        </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
